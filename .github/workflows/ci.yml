name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / unit
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      # Node and pnpm are baked into the runner image (see the backend repo's
      # deploy/runner/Dockerfile). Downloading them per job dominated CI time.
      - name: Toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check:type

      - name: Unit tests
        run: pnpm test:unit

  build:
    name: build (admin)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - name: Build admin app
        run: pnpm build:antd
